<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Примеры отображения изображений</title>
<style>
:root{font-family:Inter,Arial,sans-serif;color:#18211e;background:#f5f6f3;font-synthesis:none}*{box-sizing:border-box}body{margin:0}main{max-width:1280px;margin:auto;padding:48px 32px 80px}.eyebrow{font-size:12px;letter-spacing:.11em;text-transform:uppercase;color:#50756a;font-weight:700}h1{font-size:clamp(30px,4vw,48px);line-height:1.08;letter-spacing:-.045em;margin:14px 0}header p{max-width:650px;color:#616c67;line-height:1.6;margin:0}.toolbar{margin:32px 0 36px;padding:20px 24px;background:#e7eee9;border:1px solid #d9e5dd;border-radius:16px;display:flex;gap:20px;align-items:center;justify-content:space-between}.toolbar strong{display:block;font-size:15px}.toolbar p{margin:5px 0 0;color:#53665b;font-size:14px;line-height:1.4}.upload{display:inline-flex;align-items:center;justify-content:center;min-height:44px;white-space:nowrap;padding:0 18px;background:#213e32;color:white;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer}.upload:hover{background:#315846}.upload:focus-within{outline:3px solid #70a78b;outline-offset:3px}.upload input{position:absolute;width:1px;height:1px;opacity:0}.error{color:#a1362d!important}.examples{display:grid;gap:34px}.example{border-top:1px solid #d8dfd9;padding-top:24px}.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:18px}.section-head h2{font-size:21px;letter-spacing:-.025em;margin:0}.section-head span,.caption span{font-size:13px;color:#6e7972}.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}.preview-wrap{min-width:0}.caption{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-bottom:10px}.caption strong{font-size:14px}.preview{position:relative;overflow:hidden;isolation:isolate;border-radius:16px;background:#dfe5e0}.preview.square{aspect-ratio:1/1;max-width:390px}.preview.wide{aspect-ratio:16/9}.preview img{position:absolute;inset:0;width:100%;height:100%}.backdrop{object-fit:cover;filter:blur(18px);transform:scale(1.12)}.foreground{object-fit:contain}.note{margin-top:42px;padding-top:20px;border-top:1px solid #d8dfd9;color:#68746c;font-size:13px;line-height:1.6}.note code{color:#314c3d;background:#e6ebe6;padding:2px 5px;border-radius:4px}@media(max-width:650px){main{padding:32px 18px 55px}.toolbar{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr;gap:22px}.preview.square{max-width:none}.section-head{flex-wrap:wrap}.examples{gap:28px}}
</style>
</head>
<body>
<main>
<div class="toolbar"><div><strong>Попробуйте своё изображение</strong><p id="upload-hint">Выберите файл — он появится во всех примерах.</p></div><label class="upload">Загрузить изображение<input id="upload" type="file" accept="image/*" aria-describedby="upload-hint"></label></div>
<div id="examples" class="examples"></div>
</main>
<script>
// Самостоятельные примеры, чтобы страница работала без сети и дополнительных файлов.
const posters = [
 {title:'Вертикальное изображение', size:'600 × 900', svg:`<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900"><rect width="600" height="900" fill="#203c35"/><circle cx="460" cy="180" r="170" fill="#d4dfb9"/><path d="M0 590 Q170 390 300 600 T600 520 V900 H0Z" fill="#e47c57"/><path d="M0 720 Q190 570 360 760 T650 690 V900 H0Z" fill="#f5c870"/><text x="46" y="66" fill="#dce9d4" font-family="Arial" font-size="20" letter-spacing="4">СОБЫТИЯ КАМПУСА</text><text x="46" y="180" fill="#fff7e9" font-family="Arial" font-weight="bold" font-size="82">ЛЕТНИЙ</text><text x="46" y="265" fill="#fff7e9" font-family="Arial" font-weight="bold" font-size="82">ВЕЧЕР</text><text x="48" y="330" fill="#fff7e9" font-family="Arial" font-size="28">Музыка, люди и море</text><text x="48" y="822" fill="#203c35" font-family="Arial" font-weight="bold" font-size="44">24 МАЯ · 18:30</text><text x="48" y="865" fill="#203c35" font-family="Arial" font-size="22">Набережная кампуса</text></svg>`},
 {title:'Квадратное изображение', size:'800 × 800', svg:`<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800"><rect width="800" height="800" fill="#e9ba73"/><circle cx="580" cy="280" r="190" fill="#d4654e"/><circle cx="580" cy="280" r="116" fill="#f4d598"/><path d="M0 610 Q180 430 350 610 T800 570 V800 H0Z" fill="#34584d"/><text x="55" y="75" fill="#293c34" font-family="Arial" font-size="21" letter-spacing="4">ВСТРЕЧА В КАМПУСЕ</text><text x="55" y="190" fill="#293c34" font-family="Arial" font-weight="bold" font-size="72">ДЕНЬ</text><text x="55" y="270" fill="#293c34" font-family="Arial" font-weight="bold" font-size="72">ИДЕЙ</text><text x="58" y="325" fill="#293c34" font-family="Arial" font-size="25">Вдохновение рядом</text><text x="55" y="714" fill="#fff8e9" font-family="Arial" font-weight="bold" font-size="40">15 ИЮНЯ · 12:00</text><text x="55" y="757" fill="#fff8e9" font-family="Arial" font-size="22">Центральная площадь</text></svg>`},
 {title:'Горизонтальное изображение', size:'960 × 540', svg:`<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540"><rect width="960" height="540" fill="#b9d4cc"/><circle cx="720" cy="200" r="140" fill="#f6ddaa"/><path d="M0 400 L210 200 L375 390 L505 265 L700 465 L830 330 L960 440 V540 H0Z" fill="#4d8172"/><path d="M0 470 Q260 350 480 470 T960 430 V540 H0Z" fill="#244b42"/><text x="48" y="58" fill="#244b42" font-family="Arial" font-size="19" letter-spacing="3">АКТИВНЫЕ ВЫХОДНЫЕ</text><text x="48" y="150" fill="#244b42" font-family="Arial" font-weight="bold" font-size="64">НАВСТРЕЧУ</text><text x="48" y="220" fill="#244b42" font-family="Arial" font-weight="bold" font-size="64">ПРИКЛЮЧЕНИЯМ</text><text x="50" y="270" fill="#244b42" font-family="Arial" font-size="24">Прогулка по острову</text><text x="50" y="495" fill="#fff8e9" font-family="Arial" font-weight="bold" font-size="30">8 ИЮНЯ · 10:00</text></svg>`}
];
const root=document.querySelector('#examples');
function imageURL(svg){return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}
function render(custom){root.replaceChildren();posters.forEach((poster,index)=>{const section=document.createElement('section');section.className='example';const title=custom?'Загруженное изображение':poster.title;section.innerHTML=`<div class="section-head"><h2>${custom?'Пример '+(index+1):title}</h2><span>${custom?'Один исходник в двух форматах':'Исходник: '+poster.size}</span></div><div class="grid"><div class="preview-wrap"><div class="caption"><strong>Прямоугольный</strong><span>16:9</span></div><div class="preview wide"><img class="backdrop" alt="" aria-hidden="true"><img class="foreground" alt="${title}"></div></div><div class="preview-wrap"><div class="caption"><strong>Квадратный</strong><span>1:1</span></div><div class="preview square"><img class="backdrop" alt="" aria-hidden="true"><img class="foreground" alt="${title}"></div></div></div>`;const url=custom||imageURL(poster.svg);section.querySelectorAll('img').forEach(img=>img.src=url);root.append(section)});if(custom){while(root.children.length>1)root.lastElementChild.remove()}}
render();
let currentURL;document.querySelector('#upload').addEventListener('change',event=>{const file=event.target.files[0];if(!file)return;const hint=document.querySelector('#upload-hint');if(!file.type.startsWith('image/')){hint.textContent='Пожалуйста, выберите файл изображения.';hint.classList.add('error');return}const nextURL=URL.createObjectURL(file);const probe=new Image();probe.onload=()=>{render(nextURL);if(currentURL)URL.revokeObjectURL(currentURL);currentURL=nextURL;hint.textContent=`${file.name} · ${probe.naturalWidth} × ${probe.naturalHeight}`;hint.classList.remove('error')};probe.onerror=()=>{URL.revokeObjectURL(nextURL);hint.textContent='Не удалось открыть изображение. Попробуйте другой файл.';hint.classList.add('error')};probe.src=nextURL});
</script>
</body>
</html>
